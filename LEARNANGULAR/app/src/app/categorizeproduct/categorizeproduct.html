<table border="1">
    <thead>
        <tr>
            <th>Mã Danh Mục</th>
            <th>Tên Danh Mục</th>
        </tr>
    </thead>

    <tbody style="text-align: justify;">
        <ng-container *ngFor="let cate of categories">

           
            <tr>
                <td>{{ cate.Cateid }}</td>
                <td>{{ cate.CateName }}</td>
            </tr>

    
            <tr>
                <td colspan="2">
                    <table border="1">
                        <tr>
                            <th>Mã Sản Phẩm</th>
                            <th>Tên Sản Phẩm</th>
                            <th>Giá Sản Phẩm</th>
                            <th>Picture</th>
                        </tr>

                        <tr *ngFor="let p of cate.Products">
                            <td>{{ p.ProductId }}</td>
                            <td>{{ p.ProductName }}</td>
                            <td>{{ p.Price }}</td>
                            <td>
                                <img
                                    [src]="p.Image"
                                    width="50"
                                    height="50">
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

        </ng-container>
    </tbody>
</table>
