<p>product-http-handle-error-service-component works!</p>
{{errMessage()}}
<table>
    <thead border=1>
        <tr>
            <th>ID</th>
            <th>NAME</th>
            <th>PRICE</th>
            <th>IMAGE</th>
        </tr>
    </thead>
    <tbody>
        @for (p of products(); track p.id)
    {
            <tr>
                <td>{{p.id}}</td>
                <td>{{p.name}}</td>
                <td>{{p.price}}</td>
                <td><img [src]='p.image' [alt]="p.name" width="100" height="30"></td>
            </tr>
        }
        @empty{
            <tr>
                <td colspan="4">Not Found Product</td>
            </tr>
        }
   
    
    </tbody>
</table>
